<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Auto - Autentificare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-service">
    <div class="container">
      <a class="navbar-brand" href="index.html">🔧 Service Auto</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Acasă</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Servicii</a></li>
          <li class="nav-item"><a class="nav-link" href="appointments.html">Programări</a></li>
          <li class="nav-item"><a class="nav-link" href="prices.html">Prețuri</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">Despre</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
        <div class="navbar-nav">
          <a class="btn btn-outline-light btn-sm" href="login.html">Autentificare</a>
          <a class="btn btn-warning btn-sm ms-2" href="register.html">Înregistrare</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <h1 class="page-title">Autentificare</h1>
        <div class="card">
          <div class="card-body">
            <form id="login-form">
              <div id="login-feedback" class="alert d-none" role="alert"></div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="login-email" placeholder="email@exemplu.ro" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Parolă</label>
                <input type="password" class="form-control" id="login-password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Conectare</button>
            </form>
            <p class="mt-3 mb-0 text-center small">Nu ai cont? <a href="register.html">Înregistrează-te</a>.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer-service text-center">
    <div class="container">
      <p class="mb-0">&copy; 2025 Service Auto. Toate drepturile rezervate. | <a href="contact.html">Contact</a> | <a href="about.html">Despre noi</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var feedback = document.getElementById('login-feedback');

      try {
        var response = await fetch('http://localhost:5099/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value
          })
        });

        var result = await response.json();
        if (!response.ok) {
          feedback.className = 'alert alert-danger';
          feedback.textContent = result.message || 'Autentificare esuata.';
          return;
        }

        localStorage.setItem('serviceAutoUser', JSON.stringify(result.user));
        window.location.href = 'index.html';
      } catch {
        feedback.className = 'alert alert-danger';
        feedback.textContent = 'Backend indisponibil. Ruleaza ServiceAutoApp pe http://localhost:5099.';
      }
    });
  </script>
</body>
</html>
